plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.example.panesunlock'

    defaultConfig {
        applicationId "com.example.panesunlock"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    signingConfigs {
        // 固定签名密钥（已提交进仓库），保证每次构建签名一致，覆盖安装无需卸载。
        // 若密钥文件缺失/不可用，则回退到默认 debug 签名，构建仍可进行（CI 友好）。
        fixed {
            def ksFile = file("$projectDir/keystore.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "panesunlock123"
                keyAlias "panes"
                keyPassword "panesunlock123"
            }
        }
    }

    buildTypes {
        debug {
            if (signingConfigs.fixed.storeFile != null) {
                signingConfig signingConfigs.fixed
            }
        }
        release {
            if (signingConfigs.fixed.storeFile != null) {
                signingConfig signingConfigs.fixed
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 仅编译期依赖，不打进 APK（LSPosed 运行环境已提供）
    compileOnly 'de.robv.android.xposed:api:82'
    // 界面
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
