plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.example.panesunlock'

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 仅编译期依赖，不打进 APK（LSPosed 运行环境已提供）
    compileOnly 'de.robv.android.xposed:api:82'
    // 界面使用 AppCompat 主题（更小、构建稳定）
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
